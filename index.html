<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localhost</title>
</head>
<body style="margin:0;background:#000">
<pre id="status" style="color:white;padding:24px;font-family:monospace">loading...</pre>
<script>
(async()=>{
  try{
    const files=Array.from({length:9},(_,i)=>`payload-v5-${String(i+1).padStart(2,"0")}.txt`);
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:"no-store"});
      if(!r.ok) throw new Error(`${f}: ${r.status}`);
      return (await r.text()).trim();
    }));
    const s=parts.join("");
    const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<pre style="color:white;padding:24px;font-family:monospace">site load failed\n'+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
