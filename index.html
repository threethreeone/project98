<script>(async()=>{try{const s=(window.__p||[]).join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="color:white;padding:24px;font-family:monospace">site load failed\n'+String(e)+'</pre>'}})();</script></body></html>
